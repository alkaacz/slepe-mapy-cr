<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />

  <title>Slepá mapa Česka</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Slepá mapa Česka</h1>
      <p>
        Vyber si kategorii a doplňuj názvy přímo do mapy. Obrys i trasy odpovídají
        reálné geografii ČR — nic není jen od oka.
      </p>
    </div>

    <div class="mode-grid">
      <a class="mode-card" href="map.html?mode=reky">
        <div class="mode-name">Řeky</div>
        <div class="mode-desc">12 hlavních toků naznačených tenkou linkou</div>
      </a>
      <a class="mode-card" href="map.html?mode=vodni-dila">
        <div class="mode-name">Vodní díla</div>
        <div class="mode-desc">Přehrady a vodní nádrže jako klikatelné body</div>
      </a>
      <div class="mode-card disabled">
        <div class="mode-name">Kraje</div>
        <div class="mode-desc">Připravujeme</div>
      </div>
      <div class="mode-card disabled">
        <div class="mode-name">Pohoří</div>
        <div class="mode-desc">Připravujeme</div>
      </div>
    </div>
  </div>

</html>
